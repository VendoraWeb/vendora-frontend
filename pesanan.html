<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesanan saya — Vendora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" href="logo.png?v=2">
  <link rel="apple-touch-icon" href="logo.png?v=2">
  <meta name="theme-color" content="#0E0E0D">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Montserrat:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=14">
  <link rel="stylesheet" href="css/theme.css?v=7">
  <link rel="stylesheet" href="css/account.css?v=5">
</head>
<body class="account-page">

  <header class="acc-top">
    <a href="index.html" class="acc-logo vlogo" aria-label="Vendora — beranda">
      <span class="vlogo-word">V<span class="vlogo-en"><img class="vlogo-mark" src="logo.svg?v=3" alt="">EN</span>DORA</span>
    </a>
    <div class="acc-top-right">
      <a href="index.html" class="acc-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span> Lanjut belanja</span>
      </a>
      <a href="akun.html" class="acc-back"><span>Pengaturan akun</span></a>
    </div>
  </header>

  <div id="alert-container"></div>

  <main id="orders-locked" class="acc-locked" hidden>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <h1>Masuk untuk melihat pesanan</h1>
    <p>Lacak status pesanan dan riwayat belanjamu setelah masuk.</p>
    <a href="login.html" class="btn-ink">Masuk</a>
  </main>

  <main id="orders-app" class="orders-wrap" hidden>
    <div class="acc-head">
      <h1>Pesanan saya</h1>
      <p>Lacak status pesanan dan lihat riwayat belanjamu.</p>
    </div>

    <div class="orders-bar">
      <div class="orders-tabs" id="order-tabs" role="tablist" aria-label="Status pesanan">
        <button class="otab active" type="button" role="tab" aria-selected="true" data-status="all">Semua <span class="tab-count">0</span></button>
        <button class="otab" type="button" role="tab" aria-selected="false" data-status="pending">Menunggu <span class="tab-count">0</span></button>
        <button class="otab" type="button" role="tab" aria-selected="false" data-status="paid">Dikemas <span class="tab-count">0</span></button>
        <button class="otab" type="button" role="tab" aria-selected="false" data-status="shipped">Dikirim <span class="tab-count">0</span></button>
        <button class="otab" type="button" role="tab" aria-selected="false" data-status="success">Selesai <span class="tab-count">0</span></button>
        <button class="otab" type="button" role="tab" aria-selected="false" data-status="cancelled">Dibatalkan <span class="tab-count">0</span></button>
      </div>
      <label class="orders-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="visually-hidden">Cari pesanan</span>
        <input type="search" id="orders-search" placeholder="Cari nama produk, toko, atau nomor pesanan" autocomplete="off">
      </label>
    </div>

    <div id="orders-list" class="orders-list">
      <div class="orders-empty"><p>Memuat pesanan…</p></div>
    </div>
  </main>

  <script type="module" src="js/main.js?v=32"></script>
</body>
</html>
